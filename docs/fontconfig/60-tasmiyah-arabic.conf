<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Arabic fallback for terminal fonts (tasmiyah-cli).

  Your terminal font stays primary (Latin text, icons, prompt). Any glyph it
  lacks (Arabic) goes to fixed-width Arabic fonts so letters join across cells:
    Kawkab Mono (letters, marks, joined forms) -> Thabit (isolated forms)
    -> Noto Sans Arabic (alef wasla and anything else still missing).

  Install:
    1. Copy this file to ~/.config/fontconfig/conf.d/60-tasmiyah-arabic.conf
    2. Run: fc-cache -f
    3. Fully quit the terminal (close ALL its windows), then reopen it.
  Undo: delete the file, run fc-cache -f, and restart the terminal.
-->
<fontconfig>
  <!-- Replace "JetBrainsMono Nerd Font" with the exact font family your terminal uses
       (check with: fc-list | grep -i yourfont). Add one more <match> block per extra font.
       Do not target the generic "monospace" alias: it would also change your Latin font. -->
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="append" binding="strong"><string>Kawkab Mono</string><string>Thabit</string><string>Noto Sans Arabic</string></edit>
  </match>
</fontconfig>
