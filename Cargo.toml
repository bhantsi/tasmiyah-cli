[package]
name = "tasmiyah-cli"
version = "0.4.0"
edition = "2021"
authors = ["Hamza"]
description = "A beautiful, fast terminal greeting that prints Bismillah and Islamic phrases"
license = "MIT"
repository = "https://github.com/bhantsi/tasmiyah-cli"
readme = "README.md"
keywords = ["cli", "islamic", "bismillah", "terminal", "greeting"]
categories = ["command-line-utilities"]
default-run = "tasmiyah"

# The binary users will invoke from their shell. `default-run` keeps a
# bare `cargo run` working now that the crate also ships the `gen` bin.
[[bin]]
name = "tasmiyah"
path = "src/main.rs"

# Artifact generator (shell completions + man page), built only with
# `--features gen` so the shipped binary never links clap_complete /
# clap_mangen. Run: `cargo run --features gen --bin gen`.
[[bin]]
name = "gen"
path = "src/bin/gen.rs"
required-features = ["gen"]

[features]
gen = ["dep:clap_complete", "dep:clap_mangen"]

[dependencies]
# CLI argument parsing — the de-facto standard
clap = { version = "4.5", features = ["derive"] }

# Cross-platform terminal: colors, size detection, works on Windows too
crossterm = "0.28"

# Correct visual width for Unicode (essential for Arabic centering)
unicode-width = "0.2"

# Arabic presentation-form shaping for terminals without BiDi (`--arabic shaped`)
ar-reshaper = "1.5"

# Daily-cached crates.io version check so users see a one-line notice
# when a new release ships. Pulled in with default features (`ureq`
# blocking client, no `reqwest`/OpenSSL), runs once per 24h per user.
update-informer = "1"

# Config file support: ~/.config/tasmiyah/config.toml
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"

# Build-time generators for shell completions and the man page, gated
# behind the `gen` feature so the shipped binary never links them.
clap_complete = { version = "4.5", optional = true }
clap_mangen = { version = "0.2", optional = true }

[profile.release]
# Optimize for binary size + speed — important for a tool that runs at shell startup
opt-level = 3
lto = true            # Link-time optimization
codegen-units = 1     # Better optimization at the cost of compile time
strip = true          # Strip symbols from binary
panic = "abort"       # Smaller binary, no unwinding needed
